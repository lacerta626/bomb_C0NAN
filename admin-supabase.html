<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AFTER 11:07 관리자</title>
  <link rel="stylesheet" href="supabase-ui.css">
  <style>
    body{background:#080d18;color:#fff;max-width:1280px;margin:32px auto;padding:16px;font-family:system-ui,sans-serif}
    button,input,select{margin:3px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.5}.scroll{overflow:auto}
    table{border-collapse:collapse;width:100%;min-width:900px}th,td{border-bottom:1px solid #35445c;text-align:left;padding:10px}
    th{background:#15243b;position:sticky;top:0}pre{white-space:pre-wrap}.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .hint{color:#b9c8d9}.status-ok{color:#7dffa0}.status-error{color:#ff9eae}
  </style>
</head>
<body>
  <h1>AFTER 11:07 / 게임 랭킹 관리자</h1>
  <p class="hint">Supabase Auth 로그인과 admin_users 관리자 권한을 각각 확인합니다.</p>

  <section class="fb-panel">
    <div class="toolbar">
      <input id="email" type="email" autocomplete="username" placeholder="관리자 이메일">
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button id="login">로그인</button><button id="logout">로그아웃</button>
    </div>
    <p id="auth-status">로그인 상태: 확인 전</p>
    <p id="admin-status">관리자 권한: 확인 전</p>
    <div class="toolbar">
      <button id="create" disabled>코드 100개 생성</button><button id="refresh" disabled>전체 갱신</button>
      <button id="download" disabled>신규 코드 CSV</button><button id="results-csv" disabled>결과 CSV</button>
    </div>
    <p id="status" role="status"></p><pre id="codes"></pre>
  </section>

  <section class="fb-panel">
    <h2>참가 코드</h2><input id="code-search" placeholder="코드 또는 닉네임 검색"><p id="count"></p>
    <div class="scroll"><table><thead><tr><th>코드</th><th>닉네임</th><th>Easy</th><th>Hard</th><th>총 사용</th><th>상태</th><th>관리</th></tr></thead><tbody id="list"></tbody></table></div>
  </section>

  <section class="fb-panel">
    <h2>게임 기록</h2>
    <div class="toolbar"><select id="mode-filter"><option value="">전체 난이도</option><option value="easy">Easy</option><option value="hard">Hard</option></select><select id="result-filter"><option value="">전체 결과</option><option value="success">성공</option><option value="failed">실패</option></select><input id="result-search" placeholder="코드 또는 닉네임 검색"></div>
    <div class="scroll"><table><thead><tr><th>코드</th><th>닉네임</th><th>난이도</th><th>시도</th><th>남은 시간</th><th>소요 시간</th><th>결과</th><th>유효</th><th>시작</th><th>관리</th></tr></thead><tbody id="results"></tbody></table></div>
  </section>

  <script type="module" src="admin-supabase.js?v=20261106-4"></script>
</body>
</html>
