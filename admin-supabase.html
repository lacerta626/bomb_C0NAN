<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTER 11:07 관리자</title><link rel="stylesheet" href="supabase-ui.css"><style>body{background:#080d18;color:#fff;max-width:1180px;margin:32px auto;padding:16px;font-family:system-ui,sans-serif}button{cursor:pointer;margin:3px;padding:8px 12px}button:disabled{opacity:.5;cursor:not-allowed}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{border-bottom:1px solid #35445c;text-align:left;padding:10px}th{background:#15243b}input{padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#b9c8d9}</style></head><body><h1>AFTER 11:07 / 참가 코드 관리자</h1><p class="hint">Supabase 관리자 이메일로 로그인한 뒤 코드를 생성하고 횟수를 관리합니다.</p><section class="fb-panel"><input id="email" type="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button><button id="logout">로그아웃</button><button id="create" disabled>코드 100개 생성</button><button id="refresh" disabled>목록 갱신</button><button id="download" disabled>CSV 저장</button><p id="status" role="status"></p><pre id="codes"></pre></section><section class="fb-panel"><h2>코드별 사용 기록</h2><p id="count"></p><div class="scroll"><table><thead><tr><th>코드</th><th>Easy 사용</th><th>Hard 사용</th><th>총 사용</th><th>상태</th><th>관리</th></tr></thead><tbody id="list"></tbody></table></div></section><script type="module" src="admin-supabase.js"></script></body></html>
