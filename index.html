<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="폭처조 교류회 Coming Soon — 폭탄 해체를 위한 진입중입니다.">
  <title>폭처조 교류회 | Mission Locked</title>
  <style>@font-face { font-family: 'DungGeunMo'; src: url('assets/fonts/DungGeunMo.woff2') format('woff2'); font-display: swap; }

:root {
  --background: #020216;
  --foreground: #f7fbff;
  --cyan: #00e9f5;
  --magenta: #ff00d9;
  --muted: #b8c7d8;
  --image-width: max(100vw, 177.7778vh);
  --image-height: max(100vh, 56.25vw);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; overflow: hidden; color: var(--foreground); background: var(--background); font-family: 'DungGeunMo', monospace; }
button { font: inherit; }

.control-room {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  background: url('assets/index-bg.jpg') center / cover no-repeat;
  isolation: isolate;
}

.control-room::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: radial-gradient(circle at 50% 46%, transparent 10%, rgba(0, 1, 18, .1) 58%, rgba(0, 1, 18, .34));
  pointer-events: none;
}

.screen-glow, .mission-console {
  position: absolute;
  left: 50%;
  top: calc(50% - var(--image-height) * .033);
  transform: translate(-50%, -50%);
}

.screen-glow {
  width: calc(var(--image-width) * .335);
  height: calc(var(--image-height) * .402);
  box-shadow: inset 0 0 3vw rgba(0, 229, 245, .1), 0 0 2vw rgba(0, 229, 245, .08);
  pointer-events: none;
}

.mission-console {
  width: calc(var(--image-width) * .318);
  height: calc(var(--image-height) * .374);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(10px, 1.3vw, 26px);
  text-align: center;
  background: rgba(1, 2, 24, .8);
  border: 1px solid rgba(255, 255, 255, .2);
  box-shadow: inset 0 0 28px rgba(0, 233, 245, .06);
  overflow: hidden;
}

.mission-console::before { content: ''; position: absolute; inset: 7px; border: 1px dashed rgba(0, 233, 245, .28); pointer-events: none; }
.console-corners::before, .console-corners::after { content: ''; position: absolute; top: 13px; width: 18px; height: 18px; border-top: 2px solid var(--magenta); }
.console-corners::before { left: 13px; border-left: 2px solid var(--magenta); }
.console-corners::after { right: 13px; border-right: 2px solid var(--magenta); }

.eyebrow { margin: 0 0 clamp(5px, .7vw, 12px); color: var(--cyan); font-size: clamp(.42rem, .56vw, .7rem); letter-spacing: .18em; }
h1 { margin: 0; font-size: clamp(1.05rem, 2.1vw, 2.7rem); line-height: 1; letter-spacing: .04em; text-shadow: -.08em 0 rgba(255, 0, 217, .5), .08em 0 rgba(0, 233, 245, .6), 0 0 .6em rgba(255,255,255,.2); }
.coming-soon { margin: clamp(6px, .8vw, 15px) 0 clamp(4px, .6vw, 10px); color: var(--magenta); font-size: clamp(.62rem, 1vw, 1.25rem); letter-spacing: .12em; text-shadow: 0 0 12px rgba(255, 0, 217, .7); }
.cursor { display: inline-block; width: .55em; height: .9em; margin-left: .35em; vertical-align: -.08em; background: var(--cyan); animation: blink .85s steps(2, end) infinite; }
.description { margin: 0; color: var(--muted); font-size: clamp(.68rem, .86vw, 1.05rem); }

.status-grid { display: grid; gap: clamp(2px, .25vw, 5px); width: min(82%, 440px); margin: clamp(7px, .85vw, 16px) auto; padding: clamp(4px, .45vw, 8px); border: 1px solid rgba(0, 233, 245, .42); background: rgba(0, 0, 13, .7); }
.status-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: clamp(2px, .25vw, 5px) clamp(5px, .45vw, 9px); color: #9aabc0; background: rgba(5, 16, 41, .65); border-left: 2px solid var(--cyan); font-size: clamp(.42rem, .52vw, .65rem); line-height: 1.25; text-align: left; }
.status-row strong { color: var(--cyan); font-weight: 400; text-align: right; }
.status-row strong::after { content: '_'; color: #fff; animation: blink .8s steps(2, end) infinite; }

.standby-button { min-width: clamp(105px, 11vw, 165px); padding: clamp(6px, .5vw, 10px) 15px; color: white; background: #09142b; border: 1px solid var(--magenta); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .75), 0 0 14px rgba(255, 0, 217, .3); cursor: pointer; font-size: clamp(.5rem, .62vw, .75rem); letter-spacing: .08em; transition: color .16s, border-color .16s, box-shadow .16s; }
.standby-button:hover, .standby-button:focus-visible, .standby-button.is-armed { color: #001316; background: var(--cyan); border-color: white; box-shadow: 0 0 16px rgba(0, 233, 245, .65); outline: none; }

footer { position: absolute; right: 18px; bottom: 12px; max-width: 46vw; color: rgba(255, 255, 255, .56); font-size: clamp(.45rem, .55vw, .7rem); text-align: right; text-shadow: 0 1px 3px #000; }

@keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
@media (max-aspect-ratio: 3 / 4) { .mission-console { width: calc(var(--image-width) * .325); height: calc(var(--image-height) * .385); } .status-grid { width: 90%; } footer { max-width: 70vw; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

/* STANDBY → MAIN: short RGB glitch, no second loading screen */
body.is-entering .control-room { animation: enter-glitch .62s steps(1,end) both; }
body.is-entering::after { content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,235,255,.16) 0 2px,transparent 2px 8px);
  animation: enter-flash .62s steps(1,end) both; }
@keyframes enter-glitch {
  0%,100%{filter:none;transform:none}
  12%{filter:drop-shadow(8px 0 #f000ed) drop-shadow(-8px 0 #00b5ff);transform:translateX(-5px)}
  24%{filter:contrast(2);transform:translateX(8px) skewX(-2deg)}
  36%{filter:invert(1);transform:translateX(-3px)}
  48%{filter:drop-shadow(-10px 0 #f000ed);transform:translateX(4px)}
  65%{filter:none;transform:none}
  80%{filter:contrast(2);transform:translateX(-2px)}
}
@keyframes enter-flash {0%,15%,40%,65%{opacity:0} 16%,22%,41%,47%,66%,95%{opacity:1} 100%{opacity:0}}
</style>
</head>
<body>
  <main class="control-room">
    <div class="screen-glow" aria-hidden="true"></div>
    <section class="mission-console" aria-labelledby="mission-title">
      <div class="console-corners" aria-hidden="true"></div>
      <p class="eyebrow">SPECIAL MISSION CHANNEL</p>
      <h1 id="mission-title">MISSION LOCKED</h1>
      <p class="coming-soon">COMING SOON<span class="cursor" aria-hidden="true"></span></p>
      <p class="description">폭탄 해체를 위한 진입중입니다.</p>
      <div class="status-grid" aria-label="미션 상태">
        <div class="status-row"><span>STATUS</span><strong data-value="PREPARING">&nbsp;</strong></div>
        <div class="status-row"><span>ACCESS</span><strong data-value="LOCKED">&nbsp;</strong></div>
        <div class="status-row"><span>NEXT BRIEFING</span><strong data-value="SOON">&nbsp;</strong></div>
      </div>
      <button class="standby-button" type="button" aria-pressed="false"><span>STANDBY</span></button>
    </section>
    <footer>Fan-made event website. Not affiliated with the official copyright holders.</footer>
  </main>
  <script>
    document.querySelectorAll('[data-value]').forEach((el, row) => {
      const value = el.dataset.value;
      setTimeout(() => {
        let index = 0;
        const ticker = setInterval(() => {
          index += 1;
          el.textContent = value.slice(0, index);
          if (index >= value.length) clearInterval(ticker);
        }, 60);
      }, 350 + row * 360);
    });
    const button = document.querySelector('.standby-button');
    let isTransitioning = false;
    button.addEventListener('click', () => {
      if (isTransitioning) return;
      isTransitioning = true;
      button.disabled = true;
      button.classList.add('is-armed');
      button.setAttribute('aria-pressed', 'true');
      button.querySelector('span').textContent = 'CONNECTING...';
      document.body.classList.add('is-entering');
      // The intro is the only entry gate. The main page has no second loader.
      window.setTimeout(() => { window.location.href = 'home.html'; },
        window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 80 : 620);
    });
  </script>
</body>
</html>
